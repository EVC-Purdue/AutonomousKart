# Planner / pathfinder configuration.
#
# The rcl YAML parser rejects nested maps alongside scalar values under
# `ros__parameters`, so EVERY planner-specific param is written as a flat
# dotted key here (e.g. `mpc.horizon_steps: 20`) and Python reads them via
# `node.get_parameters_by_prefix("mpc")`.

/**:
  ros__parameters:
    # Kart-wide physical limits (shared by every node)
    v_max_mps: 12.0 # max kart speed (m/s)
    wheelbase_m: 1.05 # rear-axle → front-axle (m)
    steer_max_deg: 60.0 # physical front-wheel steering limit (deg)
    steer_rate_max_degps: 33.7 # max steering slew rate (deg/s)
    a_max_mps2: 5.3 # max forward acceleration (m/s^2)
    a_min_mps2: -3.0 # max braking deceleration (m/s^2, negative)
    a_lat_max_mps2: 5.3 # tire-grip lateral accel cap (m/s^2)

pathfinder_node:
  ros__parameters:
    # Active planner: mpc | opencv | pure_pursuit
    planner: mpc

    # pure_pursuit
    pure_pursuit.use_velocity_scaled_lookahead: true
    pure_pursuit.lookahead_time_s: 0.6
    pure_pursuit.min_lookahead_m: 3.0
    pure_pursuit.max_lookahead_m: 8.0
    pure_pursuit.use_curvature_regulation: true
    pure_pursuit.min_radius_m: 7.0
    pure_pursuit.min_reg_speed_mps: 7.0
    pure_pursuit.approach_dist_m: 1.0
    pure_pursuit.min_approach_speed_mps: 1.0
    pure_pursuit.search_window: 80
    pure_pursuit.initial_sync_done: false
    pure_pursuit.max_resync_dist: 80
    pure_pursuit.max_closed_dist: 2
    pure_pursuit.rejoin_cte_activate: 3.0
    pure_pursuit.rejoin_cte_deactivate: 1.0
    pure_pursuit.rejoin_merge_lookahead_m: 15.0
    pure_pursuit.latency_s: 0.3
    pure_pursuit.steering_gain: 2.0

    # opencv

    # mpc: sampling MPC
    mpc.steering_gain: 3.0
    mpc.horizon_steps: 40
    mpc.dt_s: 0.05
    mpc.num_samples: 128
    mpc.steer_sigma_deg: 5.0
    mpc.accel_sigma_mps2: 1.43
    mpc.proj_window_back: 5
    mpc.proj_window_fwd: 37
    mpc.frenet_v_window_s: 0.3
    mpc.target_speed_mps: 10.0
    mpc.steer_observability_v_mps: 0.5
    # Actuator gain assumed inside MPC's bicycle rollout (yaw = v/L·tan(α·δ)).
    # 0.38 off 9/13 bags. Superseded by the knot table below wherever that is
    # non-empty; it still sets steer_max.
    mpc.actuator_gain: 0.38
    # true = learned knot table below, false = flat actuator_gain
    mpc.use_steer_map: true
    # Measured cmd_drive -> wheel angle
    mpc.steer_map_cmd_deg: [-60.0, -21.459, -17.02, -12.622, -9.518, -6.809, -4.503, -2.487, 0.074, 2.52, 4.51, 6.873, 9.514, 12.69, 16.773, 22.035, 60.0]
    mpc.steer_map_wheel_deg: [-10.8334, -10.8334, -6.7186, -3.2064, -1.1868, -0.2798, -0.1836, -0.1546, -0.0414, 0.521, 1.2881, 2.3283, 3.8017, 6.1932, 9.3724, 12.5612, 12.5612]  # Reverse
    # First-order steer lag in the rollout. Jointly fit to IMU yaw rate per day
    mpc.steer_tau_s: 0.17
    mpc.track_half_width_m: 2.0
    mpc.safety_margin_m: 0.5
    mpc.kart_half_width_m: 0.5025
    #  mpc costs
    mpc.w_d: 8.85
    mpc.w_heading: 2.97
    mpc.w_speed: 30.69
    # Rebalanced for actuator_gain=0.10: δ cost is on δ_cmd², but δ_cmd is
    # now ~10× larger than the wheel angle it produces. To keep the same
    # equilibrium between control effort and tracking, w_delta and
    # w_delta_rate scale by actuator_gain² = 0.01. Same logic for w_a_lat.
    mpc.w_delta: 0.05
    mpc.w_delta_rate: 0.12
    mpc.w_accel: 2.0
    mpc.w_boundary: 143.22
    mpc.w_progress: 6.23
    mpc.w_terminal_d: 64.86
    mpc.w_terminal_heading: 11.35
    mpc.w_a_lat: 0.0836
    # Inner-corridor "stay-centered" barrier: zero inside the inner zone,
    # quadratic out to the corridor wall.
    mpc.w_edge: 1456.58
    mpc.edge_inner_frac: 0.274
    #  mpc rejoin (bezier overlay via DynamicLineManager + RejoinStrategy)
    mpc.rejoin_cte_activate: 5.0
    mpc.rejoin_cte_deactivate: 1.0
    mpc.rejoin_merge_lookahead_m: 15.0
    mpc.rejoin_min_turning_radius: 3.0
    #  mpc failsafe / feasibility sentinels
    mpc.max_consecutive_solver_failures: 3
    mpc.infeasible_cost: 1000000000.0
    mpc.feasibility_threshold: 500000000.0
    #  mpc residual learner
    mpc.residual.mode: shadow
    mpc.residual.target_horizon_s: 0.5
    # 0.9995 is ~33 s.
    mpc.residual.forgetting_factor: 0.9995
    mpc.residual.initial_cov: 1000.0
    mpc.residual.min_train_speed_mps: 0.5
    mpc.residual.error_window: 200
    # tight so model loss does not explode
    mpc.residual.outlier_threshold_m: 2.0
    # refuses to train when |d| >= this so proj is not too noisy
    mpc.residual.max_train_d_m: 3.0
    mpc.residual.max_p_trace: 100000.0
    mpc.residual.max_theta_norm: 50.0
    # below this many RLS updates, predict() returns (0, 0) so MPC sees no noise
    mpc.residual.rls_warmup_samples: 50
    # Which model the residual fits: xs constant | s ridge linear |m gradient boosting | l 64x64 mlp | xl 128x128 mlp
    mpc.residual.model_size: m
#    GBM parms, used by model_size m
    mpc.residual.gbm_buffer_capacity: 18000
    mpc.residual.gbm_max_iter: 60
    mpc.residual.gbm_max_depth: 3
    mpc.residual.gbm_learning_rate: 0.1
    mpc.residual.gbm_min_samples_leaf: 20
    mpc.residual.gbm_retrain_secs: 10.0
    mpc.residual.gbm_min_samples_to_train: 1200
    mpc.residual.gbm_retrain_every_samples: 1200
    mpc.residual.gbm_select_eps_s_m: 0.0
    mpc.residual.gbm_select_eps_d_m: 0.005
    mpc.residual.gbm_predict_clip_m: 0.5
#    network parms, used by model_size l and xl
    mpc.residual.mlp_max_iter: 150
    mpc.residual.mlp_batch_size: 256
    mpc.residual.mlp_learning_rate: 0.002
    mpc.residual.mlp_alpha: 0.0001
    mpc.residual.mlp_n_iter_no_change: 10
    # Checkpoints + revert
    mpc.residual.checkpoint_ring_size: 5
    mpc.residual.checkpoint_keep_factor: 1.5
    mpc.residual.revert_clip_rate_window: 600
    mpc.residual.revert_clip_rate_threshold: 0.30
    mpc.residual.regime_dv_tol_mps: 1.0
    mpc.residual.regime_dd_tol_m: 0.3
    mpc.residual.regime_dkappa_rel_tol: 0.5
    # Apply-mode gate (effective_mode = shadow until this many accepted samples this run)
    mpc.residual.apply_min_samples_this_run: 1200
    # Disk cache (used in Phase 2 task wiring; default on)
    mpc.residual.cache_enabled: true
    mpc.residual.cache_load_on_start: true

    #  safety wrapper 
    safety.enabled: true
