# Params and toggles for gps node

/**:
  ros__parameters:
    # Origin of the local /odom frame, shared by every node that projects
    # lat/lon into it.
    lat0: 40.4380475 # In west lafayette
    lon0: -86.9442826

gps_node:
  ros__parameters:
    gps_frequency: 20 # Hz, receiver output rate
    # UM982 COM3 lives on the Rubik Pi (its ground on the Jetson bus-offs the CANable); scripts/kart-gps-bridge.service serves it over the direct Ethernet link.
    serial_device: "socket://192.168.10.31:5017"
    baud_rate: 115200  # set by the bridge for socket://
    status_frequency: 10 # Hz, gps/status only
    serial_poll_hz: 200
    configure_receiver: true
    receiver_port: "COM3"  # COM3 for USB, COM1 for UART
    # UM982 ANT2 tracks 0 SVs (2026-10-03); false = VTG course yaw once moving, as before the UM982.
    use_dual_heading: false
    # Dual-antenna heading 1-sigma. 0.1 deg/m (UM982 manual R1.7) over the 0.61 m antenna baseline.
    hdg_sigma_deg: 0.164
    # Added to $GPHDT; the antenna baseline reads 90 deg clockwise of the kart's nose.
    hdg_offset_deg: -90.0
    # $GPHDT reads 0.0000 with no solution, so yaw needs #HEADINGA's status.
    hdg_accept_status: ["SOL_COMPUTED"]
    # VTG (course / ground-speed) uncertainty
    vtg_speed_sigma_mps: 0.1
    vtg_min_speed_for_yaw: 0.5